{% extends "base.html" %}
{% block title %} Update {% endblock title %}
{% block body %}
  <div class="container my-4">
    <h3>Update {{todo.title}}</h3>
    <form action="/update/{{todo.sno}}" method="POST">
      <div class="mb-3">
        <label for="title" class="form-label">Update title</label>
        <input type="text" class="form-control" name="title" value="{{todo.title}}" id="title" aria-describedby="emailHelp">
      </div>
      <div class="mb-3">
        <label for="desc" class="form-label">Update description</label>
        <input type="text" class="form-control" name="desc" value="{{todo.desc}}" id="desc">
      </div>
      <button type="submit" class="btn btn-success">Update</button>
      <a href="/"><button type="button" class="btn btn-outline-secondary">Cancel</button></a>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
{% endblock body %}
